buildscript {
    repositories {
        mavenLocal()
        maven { url = "https://nexus.ala.org.au/content/groups/public/" }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "org.apache.grails:grails-gradle-plugins:$grailsVersion"
        classpath "cloud.wondrify:asset-pipeline-gradle:$assetPipelineVersion"
    }
}

version "5.0-SNAPSHOT"
group "org.grails.plugins"

apply plugin: "eclipse"
apply plugin: "idea"
apply plugin: "org.apache.grails.gradle.grails-plugin"
apply plugin: "org.apache.grails.gradle.grails-gsp"
apply plugin: "maven-publish"
apply plugin: "cloud.wondrify.asset-pipeline"

repositories {
    mavenLocal()
    maven { url = "https://nexus.ala.org.au/content/groups/public/" }
    mavenCentral()
}

dependencies {
    // Grails core dependencies
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.apache.grails:grails-core"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.apache.grails:grails-web-boot"

    // Grails plugins
    implementation "org.apache.grails:grails-cache"
    implementation "org.apache.grails:grails-scaffolding"
    runtimeOnly "cloud.wondrify:asset-pipeline-grails:$assetPipelineVersion"

    // Grails components
    compileOnly "org.apache.grails:grails-services"
    compileOnly "org.apache.grails:grails-domain-class"

    // Webjars
    implementation 'org.webjars.npm:underscore:1.13.4'
    implementation 'org.webjars:jquery:3.6.0'
    implementation 'org.webjars.bowergithub.protonet:jquery.inview:1.1.2'
    implementation 'org.webjars.npm:handlebars:4.7.7'
    implementation 'org.webjars.npm:leaflet:1.6.0'
    implementation 'org.webjars.npm:github-com-kbartas-Leaflet-draw:1.0.4'
    implementation('org.webjars.bower:Leaflet.Coordinates:0.1.5') {
        exclude group: 'org.webjars.bower', module: 'leaflet-dist'
    }
    implementation 'org.webjars.npm:leaflet-easybutton:2.4.0'
    implementation 'org.webjars.npm:leaflet-control-geocoder:2.4.0'
    implementation 'org.webjars.npm:leaflet.markercluster:1.5.3'
    implementation 'org.webjars.npm:leaflet-loading:0.1.24'
    implementation 'org.webjars.npm:leaflet-sleep:0.5.1'
    implementation 'org.webjars:font-awesome:4.7.0'
    implementation 'org.webjars.npm:urijs:1.19.11'
}

bootRun {
    ignoreExitValue = true
    jvmArgs(
        '-Dspring.output.ansi.enabled=always',
        '-XX:TieredStopAtLevel=1'
    )
    sourceResources sourceSets.main
    String springProfilesActive = 'spring.profiles.active'
    systemProperty springProfilesActive, System.getProperty(springProfilesActive)
}

assets {
    packagePlugin = true
    minifyJs = true
    // ES-module variants shipped inside webjars are never required by this plugin
    // and cannot be parsed by the Closure Compiler minifier.
    excludes = [
        'webjars/underscore/**/amd/**',
        'webjars/underscore/**/cjs/**',
        'webjars/underscore/**/modules/**',
        'webjars/handlebars/**/lib/**',
        'webjars/leaflet/**/src/**',
        'webjars/leaflet.markercluster/**/src/**',
        'webjars/leaflet.markercluster/**/build/**',
        'webjars/leaflet-control-geocoder/**/Control.Geocoder.modern.js',
        // jshint config file with a .js extension; not valid JavaScript
        'webjars/github-com-kbartas-Leaflet-draw/**/spec.hintrc.js',
        // demo/doc pages inside webjars contain relative links that escape the
        // asset root and crash asset-pipeline 5's HTML url rewriting
        'webjars/**/*.html',
        'webjars/**/*.htm',
        'webjars/**/*-esm.js',
        'webjars/**/*.esm.js',
        'webjars/**/*.mjs'
    ]
}

publishing {
    repositories {
        maven {
            name = 'Nexus'
            url = "https://nexus.ala.org.au/content/repositories/${project.version.endsWith('-SNAPSHOT') ? 'snapshots' : 'releases'}"
            credentials {
                username = System.getenv('TRAVIS_DEPLOY_USERNAME')
                password = System.getenv('TRAVIS_DEPLOY_PASSWORD')
            }
        }
    }
    publications {
        mavenJar(MavenPublication) {
            from components.java
            pom.withXml {
                def pomNode = asNode()
                // Grails 7 poms may not contain a dependencyManagement section
                pomNode.dependencyManagement.each { it.replaceNode {} }
                pomNode.dependencies.dependency.findAll {
                    it.version.text().isEmpty()
                }.each {
                    it.replaceNode {}
                }
            }
        }
    }
}
