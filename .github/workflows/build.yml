name: ALA map plugin CI/CD

on:
  push:
    branches:
      - master
      - dev
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - master
      - dev
      - 'feature/**'
      - 'hotfix/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TZ: Australia/Canberra

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "v22.22.0"
          cache: 'npm'

      - name: download JS libraries into code base (replacement for webjars)
        run: ./gradlew clientInstall

      - name: Install NPM Dependencies
        run: npm install

      - name: Build turf
        run: npm run turf

      - name: Build uuid
        run: npm run uuid

      - name: Build butUnzip
        run: npm run butUnzip

      - name: Build bootstrap with only modal
        run: npm run bootstrap-modal

      - name: JS Tests (Karma)
        run: node_modules/karma/bin/karma start karma.conf.js --single-run --browsers ChromeHeadless

      - name: Gradle Test
        run: ./gradlew test

      - name: Publish
        if: github.event_name == 'push'
        env:
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: ./gradlew publish

